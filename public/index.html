<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버거 타워 대결 🍔</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header><h1>🍔 버거 타워 대결</h1><p>한 장씩 번갈아 올려요. 무너뜨리면 패배!</p></header>
<section class="lobby" id="lobby"><label>플레이어 이름 <input id="name" maxlength="16" placeholder="닉네임" value="플레이어"></label><label>방 코드 (비워 두면 새 방 만들기) <input id="code" maxlength="6" placeholder="예: A1B2C3"></label><button id="join">방 만들기 / 입장하기</button><p class="note">친구에게 초대 링크를 보내면 서로 다른 컴퓨터에서 같은 방에 입장할 수 있습니다.</p></section>
<section id="game" hidden><div class="hud"><div class="player" id="p0">플레이어 1</div><div class="player" id="p1">플레이어 2</div><div class="centerhud"><span id="status">연결 중...</span><small id="room">방 코드</small></div><div class="player" id="p2">플레이어 3</div><div class="player" id="p3">플레이어 4</div></div><div class="share"><span id="invite"></span><button id="copy">🔗 초대 링크 복사</button><button id="start" hidden>▶ START</button></div><div class="board"><canvas id="board" width="800" height="600" aria-label="햄버거 쌓기 게임 화면"></canvas><div class="overlay" id="overlay"><div id="overlayText">상대방을 기다리는 중...</div><button id="restart" hidden>다시 대결하기</button></div></div><div class="instructions">🎯 내 차례에 마우스를 움직여 재료의 위치를 정하고 <strong>클릭</strong>해서 떨어뜨리세요. 재료가 바닥으로 떨어지면 게임 종료!</div><div id="toast" role="status"></div></section><footer>2~4인용 실시간 온라인 게임 · PC 마우스 / 모바일 터치 지원</footer></main><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
